<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wavesome.AI v1.0.31 · 2API 本地网关 R1</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
        --ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h1{font-size:17px;margin:0;font-weight:600}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--ok);border-color:#238636}
  .tag.warn{color:var(--warn);border-color:#9e6a03}
  .tag.err{color:var(--err);border-color:#da3633}
  main{padding:20px 22px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));max-width:1500px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--acc);font-weight:600}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  input,select,textarea,button{font:inherit}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px}
  textarea{min-height:74px;resize:vertical}
  button{background:#238636;border:1px solid #2ea043;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer}
  button.sec{background:#21262d;border-color:var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .row>div{flex:1;min-width:120px}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:280px;font-size:12px;margin:10px 0 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500}
  .pill{font-size:11.5px;padding:1px 7px;border-radius:99px}
  .pill.ok{background:#0f2a15;color:var(--ok)}
  .pill.err{background:#2d1114;color:var(--err)}
  #img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:12px;display:none}
  .muted{color:var(--dim);font-size:12.5px}
  .kpi{display:flex;gap:16px;flex-wrap:wrap}
  .kpi div{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:110px}
  .kpi b{display:block;font-size:18px;color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Wavesome.AI v1.0.31 · 2API 本地网关</h1>
  <span class="tag" id="tagMode">mode …</span>
  <span class="tag" id="tagToken">token …</span>
  <span class="tag" id="tagUp">ailwapi360.waveabc.xyz</span>
  <span class="tag warn">R1 结论：上游 service/generate 当前对所有设备返回 Token Error</span>
</header>

<main>
  <section class="card">
    <h2>① 文生图（/v1/images/generations）</h2>
    <label>Prompt</label>
    <textarea id="prompt">a red fox sitting in snow, oil painting, warm light</textarea>
    <div class="row">
      <div><label>尺寸</label><select id="size"><option>512x512</option></select></div>
      <div><label>风格</label><select id="style"><option value="">加载中…</option></select></div>
      <div><label>数量</label><select id="n"><option>1</option><option>2</option></select></div>
      <div style="flex:0 0 auto"><button id="btnGen">生成</button></div>
    </div>
    <pre id="genOut">等待请求…</pre>
    <img id="img" alt="result"/>
  </section>

  <section class="card">
    <h2>② 上游鉴权矩阵诊断（真实网络）</h2>
    <div class="row">
      <div style="flex:0 0 auto"><button id="btnDiag">跑一遍真实上游</button></div>
      <div class="muted" id="diagHint">逐条打真实上游，确认哪些能力可用</div>
    </div>
    <table id="diagTable"><thead><tr><th>步骤</th><th>结果</th><th>HTTP</th><th>响应</th><th>耗时</th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card">
    <h2>③ 公开端点（真实上游透传）</h2>
    <div class="row">
      <div style="flex:0 0 auto"><button class="sec" data-ep="config">config</button></div>
      <div style="flex:0 0 auto"><button class="sec" data-ep="styles">styles</button></div>
      <div style="flex:0 0 auto"><button class="sec" data-ep="blocks">blocks</button></div>
      <div style="flex:0 0 auto"><button class="sec" data-ep="gallery">gallery</button></div>
      <div style="flex:0 0 auto"><button class="sec" data-ep="sketches">sketches</button></div>
      <div style="flex:0 0 auto"><button class="sec" data-ep="device">device</button></div>
    </div>
    <pre id="epOut">点上面任一按钮</pre>
  </section>

  <section class="card">
    <h2>④ 本网关运行指标（/stats）</h2>
    <div class="kpi" id="kpi"></div>
    <table id="statTable"><thead><tr><th>endpoint</th><th>count</th><th>err</th><th>p50</th><th>p90</th><th>p99</th><th>mean</th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:10px">
      <div style="flex:0 0 auto"><button class="sec" id="btnStats">刷新指标</button></div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const setOut = (el, o) => el.textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2);

async function jget(url){ const r = await fetch(url); return {status:r.status, body: await r.json().catch(()=>null)}; }

async function boot(){
  const h = await jget('/health');
  $('#tagMode').textContent = 'mode: ' + (h.body.mock ? 'MOCK（真实CDN样图）' : 'LIVE（真实上游）');
  $('#tagMode').className = 'tag ' + (h.body.mock ? 'warn' : 'ok');
  $('#tagToken').textContent = 'device-token: ' + (h.body.device_token ? h.body.device_token : '未配置');
  $('#tagToken').className = 'tag ' + (h.body.device_token ? 'ok' : 'err');

  const c = await jget('/api/ws/config');
  if (c.body && c.body['ai.aspect_ratios']) {
    const sizes = [];
    c.body['ai.aspect_ratios'].forEach(ar => {
      const s = ar.scales && ar.scales['1x'];
      if (s) sizes.push(`${s.width}x${s.height}`);
    });
    $('#size').innerHTML = sizes.map(s=>`<option>${s}</option>`).join('');
  }
  const st = await jget('/api/ws/styles');
  if (Array.isArray(st.body)) {
    $('#style').innerHTML = st.body.slice(0,40)
      .map(x=>`<option value="${x.uuid}">${x.title}</option>`).join('');
  }
  refreshStats();
}

$('#btnGen').onclick = async () => {
  const btn = $('#btnGen'); btn.disabled = true;
  const t0 = performance.now();
  try {
    const r = await fetch('/v1/images/generations', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:$('#prompt').value, size:$('#size').value,
                            n:parseInt($('#n').value), style_uuid:$('#style').value})
    });
    const j = await r.json();
    j._local_ms = Math.round(performance.now()-t0);
    setOut($('#genOut'), j);
    const d = j.data && j.data[0];
    if (d && d.url){ $('#img').src = d.url; $('#img').style.display='block'; }
    else { $('#img').style.display='none'; }
  } catch(e){ setOut($('#genOut'), 'REQUEST FAILED: '+e); }
  btn.disabled = false;
};

$('#btnDiag').onclick = async () => {
  const btn = $('#btnDiag'); btn.disabled = true; $('#diagHint').textContent = '正在打真实上游…';
  const r = await jget('/api/ws/diagnose');
  const tb = $('#diagTable tbody'); tb.innerHTML = '';
  (r.body.steps||[]).forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.step}</td>
      <td><span class="pill ${s.ok?'ok':'err'}">${s.ok?'OK':'FAIL'}</span></td>
      <td>${s.status}</td><td class="muted">${(s.message||'').toString().slice(0,120)}</td><td>${s.ms} ms</td>`;
    tb.appendChild(tr);
  });
  $('#diagHint').textContent = '完成（' + (r.body.steps||[]).length + ' 步）';
  btn.disabled = false;
};

document.querySelectorAll('[data-ep]').forEach(b => b.onclick = async () => {
  const ep = b.dataset.ep;
  setOut($('#epOut'), 'GET /api/ws/' + ep + ' …');
  const r = await fetch('/api/ws/' + ep);
  const t = await r.text();
  let out = t;
  try {
    const j = JSON.parse(t);
    if (Array.isArray(j)) out = `数组长度 ${j.length}\n\n` + JSON.stringify(j.slice(0,2), null, 2);
    else if (ep === 'config') out = `配置键 ${Object.keys(j).length} 个：\n` + JSON.stringify(Object.fromEntries(
      Object.entries(j).map(([k,v]) => [k, Array.isArray(v) ? `list[${v.length}]` : (typeof v==='object'?'object':v)])), null, 2);
    else out = JSON.stringify(j, null, 2);
  } catch(e){}
  setOut($('#epOut'), out);
});

async function refreshStats(){
  const r = await jget('/stats');
  const eps = (r.body && r.body.endpoints) || {};
  const tb = $('#statTable tbody'); tb.innerHTML = '';
  let total = 0, errs = 0;
  Object.entries(eps).forEach(([k,v]) => {
    total += v.count; errs += v.errors;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${k}</td><td>${v.count}</td><td>${v.errors}</td>
      <td>${v.p50_ms ?? '-'}</td><td>${v.p90_ms ?? '-'}</td><td>${v.p99_ms ?? '-'}</td><td>${v.mean_ms ?? '-'}</td>`;
    tb.appendChild(tr);
  });
  $('#kpi').innerHTML = `<div><b>${total}</b>总请求</div><div><b>${errs}</b>失败</div>
    <div><b>${r.body.uptime_s ?? 0}s</b>运行时长</div><div><b>${Object.keys(eps).length}</b>端点</div>`;
}
$('#btnStats').onclick = refreshStats;

boot();
</script>
</body>
</html>
